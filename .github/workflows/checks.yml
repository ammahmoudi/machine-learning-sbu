name: Coursework checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homework-1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out coursework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.8.13"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group notebook
      - name: Download and verify UCI data
        run: uv run --locked python assignments/hw01-linear-regression/download_data.py
      - name: Reproduce all regression experiments
        run: uv run --locked python assignments/hw01-linear-regression/regression.py
      - name: Run mathematical and experiment checks
        run: uv run --locked python -m unittest discover -s assignments/hw01-linear-regression -p test_regression.py -v
      - name: Execute and validate the notebook
        run: uv run --locked --group notebook python assignments/hw01-linear-regression/execute_notebook.py
