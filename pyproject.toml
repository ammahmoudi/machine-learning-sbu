[project]
name = "sbu-machine-learning-coursework"
version = "0.1.0"
description = "Machine Learning coursework for Dr. Ali Katanforosh at SBU"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2,<3",
    "matplotlib>=3.10,<4",
    "pandas>=3.1.1",
]

[tool.uv]
package = false

[dependency-groups]
notebook = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
